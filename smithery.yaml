# Smithery configuration for the FUIN ONI MCP server.
# Stdio server: dependency-free Python 3 (standard library only).
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
  commandFunction: |-
    (config) => ({
      command: 'python3',
      args: ['mcp/fuin_mcp.py'],
      env: {}
    })
